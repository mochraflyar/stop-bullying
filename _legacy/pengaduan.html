<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pengaduan Bullying</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Form Pengaduan CS</h1>
  </header>

  <main>
    <div class="form-card">
      <h2>Laporkan Kejadian Bullying</h2>

      <form action="#" method="POST">
        <div class="anonim-box">
          <input type="checkbox" id="anonim" name="anonim">
          <label for="anonim">Saya ingin melapor secara Anonim / Rahasia</label>
        </div>

        <label for="nama">Nama Lengkap (kosongkan jika anonim)</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda">

        <label for="kelas">Kelas / Status</label>
        <input type="text" id="kelas" name="kelas" placeholder="Contoh: VII-A / Orang Tua / Guru">

        <label for="laporan">Detail Kejadian / Laporan</label>
        <textarea id="laporan" name="laporan" rows="5" placeholder="Ceritakan detail kejadian bullying yang Anda alami atau saksikan..."></textarea>

        <button type="submit" class="btn">Kirim Laporan</button>
      </form>

      <a href="index.html" class="btn btn-back">← Kembali ke Beranda</a>
    </div>

    <div class="info-card">
      <h3>Langkah Setelah Melapor</h3>
      <p>Tim kami akan meninjau laporan Anda dalam 24 jam. Semua informasi dijaga kerahasiaannya.</p>
    </div>

    <div class="poster-card">
      <h2>Poster Alur Pelaporan Anonim &amp; Aman</h2>
      <img src="https://via.placeholder.com/600x400?text=Poster+Alur+Pelaporan+Anonim+%26+Aman" alt="Poster Alur Pelaporan Anonim &amp; Aman" class="poster-img">
      <p class="poster-caption">Poster Alur Pelaporan Anonim &amp; Aman</p>
    </div>

    <a href="pengaduan.html" class="btn-cs">Layanan Pengaduan CS</a>
  </main>
</body>
</html>
